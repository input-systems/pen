version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-production:
        dependency-type: production
        exclude-patterns:
          - isomorphic-dompurify
          - dompurify
      npm-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # Action v2 requires @changesets/cli v3. Stay on v1 until the CLI upgrades.
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
