name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; pushes to a release branch
  # are not, so every commit on main keeps a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect e2e-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # GA11 population. Walked dependencies + peerDependencies of
          # the Playwright host (@input/pen-playground —
          # playwright.config.ts webServer and testDir) and
          # @input/pen-dom. Closure:
          #   packages/core, packages/crdt/yjs, packages/types,
          #   packages/schema/default, packages/presets/default,
          #   packages/rendering/dom, packages/rendering/react,
          #   packages/extensions/{ai,document-ops,history,input-rules,
          #   interop,multiplayer,search,shortcuts,undo},
          #   packages/shared/{content-ops,markdown-serialization},
          #   packages/tooling/assets-memory,
          #   host playground.
          # Not in the closure: examples/*, packages/rendering/vue,
          # packages/transports/*, packages/tooling/{bench,conformance,
          # eslint-plugin,test}, packages/docs.
          filters: |
            e2e:
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'playwright.config.ts'
              - 'playground/**'
              - 'packages/core/**'
              - 'packages/crdt/yjs/**'
              - 'packages/types/**'
              - 'packages/schema/default/**'
              - 'packages/presets/default/**'
              - 'packages/rendering/dom/**'
              - 'packages/rendering/react/**'
              - 'packages/extensions/**'
              - 'packages/shared/**'
              - 'packages/tooling/assets-memory/**'

  validate:
    name: Lint, types and tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Pen toolchain
        uses: ./.github/actions/setup
        with:
          turbo-cache-scope: validate

      - name: Lint repository surfaces
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Check API reports
        run: node scripts/api-reports.mjs

      - name: Check types-package purity
        run: node scripts/types-purity.mjs

      - name: Check @internal stripping
        run: node scripts/strip-internal.mjs

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Run unit and integration tests
        # --maxWorkers=2 is forwarded through turbo to every `vitest run`.
        # Without it each package spawns ~CPU workers on a 4-vCPU runner
        # that is already running every package at once.
        run: pnpm test -- --maxWorkers=2

  e2e:
    # Check names are Browser tests (Chromium) / (WebKit) / (Firefox). The
    # name has to interpolate a matrix value or GitHub appends the raw matrix
    # tuple to it, which is where `(javascript-typescript, none)` comes from
    # on jobs that do not. Branch protection requires the aggregate `Summary`
    # job below rather than these names, so promoting an engine no longer
    # needs a settings change.
    name: Browser tests (${{ matrix.label }})
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # chromium and webkit block the merge. firefox reports only.
    #
    # webkit promoted 2026-08-21 on the condition this comment already named —
    # its first fully green run: 11 passed, 1 pre-existing skip, 0 failed, on a
    # low-concurrency confirm run. chromium was 12/12 on the same run. earlier
    # single failures on both engines (chromium selectAll, a webkit history
    # topbar miss) appeared only under 7-worker load and passed on confirm, so
    # they were load artifacts rather than distinct bugs.
    #
    # firefox is held on ONE real defect, not on flake: after
    # editor.selectTextRange(0, 30) the authority carries the range and the
    # projector never writes it to window.getSelection(). That is an S1/S2 miss
    # (see spec/rules/selection.md), not the §4.1 gesture rule — an untrusted
    # addRange is correctly rejected, but a host calling the authority API is
    # not a proposal. Promote firefox when that projection lands; do not
    # promote it by widening a tolerance or skipping the spec.
    #
    # A continue-on-error leg reports `success` to the aggregate job, so
    # firefox red does not block. Dropping the flag here is the whole
    # promotion.
    #
    # this staging is now DECOUPLED from the conformance matrix, which was not
    # clean in the round that produced these numbers. promote the two matrices
    # separately and on their own evidence.
    continue-on-error: ${{ matrix.engine == 'firefox' }}

    strategy:
      fail-fast: false
      matrix:
        # `label` exists only to render the check name; `engine` is what
        # Playwright is given.
        include:
          - engine: chromium
            label: Chromium
          - engine: webkit
            label: WebKit
          - engine: firefox
            label: Firefox

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Pen toolchain
        uses: ./.github/actions/setup
        with:
          turbo-cache-scope: e2e-${{ matrix.engine }}

      - name: Build packages
        # playground/vite.config.ts declares no source aliases, so the dev
        # server resolves every @input/pen-* import through the package
        # exports, and those name dist/ only. Without a build Vite answers
        # "Failed to resolve entry for package" and every spec meets a blank
        # page, which reads as a product failure rather than a missing step.
        run: pnpm build

      - name: Install Playwright ${{ matrix.engine }}
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}

      - name: Run browser end-to-end tests
        run: pnpm exec playwright test --project=${{ matrix.engine }}

      - name: Upload Playwright artifacts
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  ci:
    # The single required check for this workflow. See
    # .github/actions/require-jobs for why the aggregation exists and why
    # `always()` is load-bearing.
    name: All CI jobs
    if: always()
    needs: [changes, validate, e2e]
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require validation and e2e to have succeeded
        uses: ./.github/actions/require-jobs
        with:
          needs: ${{ toJSON(needs) }}
          # e2e is skipped by design when the path filter above finds no
          # change inside the Playwright host's dependency closure.
          allow-skipped: e2e
