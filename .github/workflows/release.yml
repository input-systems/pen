name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Publish
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing + provenance (OIDC, no NPM_TOKEN)

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # stamp-first-train no-ops once a v* tag exists. Depth-1 without
          # tags would look like "no train yet" on every later cut and fail
          # closed on 0.1.1. fetch-tags still needs enough history for the
          # version PR; fetch-depth: 0 is the cheaper guarantee.
          fetch-depth: 0
          fetch-tags: true

      # No turbo-cache-scope on purpose. This job publishes; it builds from
      # nothing so the artifact that reaches npm is the one this commit
      # produces, not one a cache handed back.
      - name: Set up Pen toolchain
        uses: ./.github/actions/setup

      - name: Install npm CLI for trusted publishing
        # Node 22 ships npm 10. Trusted publishing (OIDC, no long-lived
        # token) needs npm >= 11.5.1. Install on this job only — other
        # workflows never publish.
        run: npm install -g npm@11.5.1

      - name: Lint repository surfaces
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Check API reports
        run: node scripts/api-reports.mjs

      - name: Check types-package purity
        run: node scripts/types-purity.mjs

      - name: Check @internal stripping
        run: node scripts/strip-internal.mjs

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Check published package metadata
        run: node scripts/sync-package-metadata.mjs --check

      - name: Check published packages share one train version
        run: node scripts/release-check.mjs --version-sync

      - name: Lint published package exports
        run: node scripts/release-check.mjs --publint

      - name: Check published package types
        run: node scripts/release-check.mjs --attw

      - name: Check npm provenance preconditions
        run: node scripts/release-check.mjs --provenance-preconditions

      - name: Check bundle size against baseline
        run: node scripts/size-limit.mjs

      - name: Create release pull request or publish
        id: changesets
        # SHA-pinned, not `@v1`: that tag is a mutable branch, and this step
        # holds the provenance id-token. Stay on action v1 while
        # @changesets/cli is 2.x — action v2 requires CLI v3.
        # No NPM_TOKEN: trusted publishing uses OIDC. Unset NODE_AUTH_TOKEN
        # in case the action exports an empty one that would shadow OIDC.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: env -u NODE_AUTH_TOKEN pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Tag the release train
        if: steps.changesets.outputs.published == 'true'
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "Train tag v${version} already exists"
            exit 0
          fi
          git tag "v${version}"
          git push origin "v${version}"
