name: Docs

# HB3: PRs must compile the docs site. Pages upload/deploy stay off pull requests.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Pen toolchain
        uses: ./.github/actions/setup
        with:
          turbo-cache-scope: docs

      - name: Check DOC2 pages
        run: pnpm --filter @input/pen-docs check:pages

      - name: Check COL5/COL6 collaboration contract
        run: pnpm --filter @input/pen-docs check:collaboration

      - name: Check DOC3 generated tables
        run: pnpm --filter @input/pen-docs check:tables

      - name: Type-check docs page samples
        run: pnpm --filter @input/pen-docs check:samples

      - name: Build docs site
        run: pnpm --filter @input/pen-docs build
        env:
          PEN_DOCS_BASE: ${{ steps.pages.outputs.base_path || '/' }}

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/docs/dist

  deploy:
    name: Deploy
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  docs:
    # The single required check for this workflow. See
    # .github/actions/require-jobs for why the aggregation exists and why
    # `always()` is load-bearing.
    name: All docs jobs
    if: always()
    needs: [build, deploy]
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require the docs site to have built
        uses: ./.github/actions/require-jobs
        with:
          needs: ${{ toJSON(needs) }}
          # Pages deployment is push-only; HB3 keeps it off pull requests.
          allow-skipped: deploy
