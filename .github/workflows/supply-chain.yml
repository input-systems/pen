name: Supply chain

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prod-audit:
    name: Production audit
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # This job never installs the workspace. setup-node@v5 would
          # otherwise cache the pnpm store and fail when that path is absent.
          package-manager-cache: false

      # Blocking (SEC7). Root `pnpm audit --prod` has no workspace filter, so
      # it also flags advisories that reach only private workspaces
      # (playground, examples, docs, conformance), which never ship. The
      # script keeps advisories whose install path starts at a published
      # importer, fails on any of them, and fails closed on a path whose
      # importer pnpm-lock.yaml does not list, on an audit error, and on an
      # empty workspace. Until 2026-10 it ran inline here and matched only the
      # literal `packages/x/y >` path spelling, so pnpm 10's encoded
      # `packages__x__y>` paths were all filed as out of scope and the gate
      # passed while undici highs reached @input/pen-interop.
      # The published sanitizer graph is import-html → isomorphic-dompurify →
      # dompurify and jsdom 30 → undici 8. Root pnpm.overrides pin dompurify
      # to 3.4.16, and `undici@<8` to 7.29.1 for the dev-only consumers still
      # on the undici 7 line (jsdom 28 in renderer tests, miniflare in the
      # playground).
      - name: Audit published production dependencies
        run: node scripts/prod-audit.mjs

  no-install-scripts:
    name: Install scripts
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # Reads manifests with node: builtins only, so there is no workspace
          # install here. setup-node@v5 would otherwise cache for the pnpm named
          # in packageManager and fail on the missing binary.
          package-manager-cache: false

      - name: Fail if published manifests grow install scripts
        run: node scripts/no-install-scripts.mjs

  sec8-dynamic-code-lint:
    name: Dynamic-code lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # Reads eslint.config.mjs as text; no workspace install, so decline
          # the package-manager cache for the same reason as above.
          package-manager-cache: false

      - name: Assert SEC8 rules stay error
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const config = readFileSync("eslint.config.mjs", "utf8");
          const required = [
            '"no-eval": "error"',
            '"no-new-func": "error"',
            '"no-implied-eval": "error"',
          ];
          const missing = required.filter((rule) => !config.includes(rule));

          if (missing.length > 0) {
            console.error(
              "SEC8: core dynamic-code bans keep Pen functional under script-src 'self'. They must remain \"error\":",
            );
            for (const rule of missing) console.error(`  missing ${rule}`);
            process.exit(1);
          }

          console.log(
            "SEC8: no-eval, no-new-func, and no-implied-eval remain error in eslint.config.mjs",
          );
          EOF

  supply-chain:
    # The single required check for this workflow. See
    # .github/actions/require-jobs for why the aggregation exists and why
    # `always()` is load-bearing.
    name: All audits
    if: always()
    needs: [prod-audit, no-install-scripts, sec8-dynamic-code-lint]
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require every supply-chain job to have succeeded
        uses: ./.github/actions/require-jobs
        with:
          needs: ${{ toJSON(needs) }}
